name: Code Quality

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
        
      - name: Set up Python
        run: uv python install 3.11.15

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy
        run: uv run mypy .
